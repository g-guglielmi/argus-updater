name: updater-image

# Builds & pushes the argus-updater sidecar image (ghcr.io/<owner>/argus-updater), the small
# socket-holding helper that performs Argus *core* self-updates (see deploy/updater/). It rebuilds
# when its sources change, publishing :latest (+ :sha). A vX.Y.Z tag additionally publishes a
# version-pinned image (:X.Y.Z, :X.Y) and a GitHub Release, so a deployment can pin an updater version
# instead of tracking :latest.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/updater/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  packages: write   # push the image to GHCR
  contents: write   # publish a Release on tag builds

concurrency:
  group: updater-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so git describe can stamp the build

      - name: Compute version
        id: version
        # This repo's own vX.Y.Z tags (the updater version line); '--always' falls back to a short
        # SHA between releases.
        run: echo "value=$(git describe --tags --match 'v*' --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-updater
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/updater
          file: ./deploy/updater/Dockerfile
          push: true
          build-args: |
            UPDATER_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **argus-updater ${{ github.ref_name }}** — the Argus core self-update sidecar.

            Pull `ghcr.io/${{ github.repository_owner }}/argus-updater:${{ github.ref_name }}`
            (version-pinned) or `:latest`. See the README for the compose wiring.
