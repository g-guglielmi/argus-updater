name: updater-image

# Builds & pushes the argus-updater sidecar image (ghcr.io/<owner>/argus-updater), the small
# socket-holding helper that recreates a target container on a new image - used by BOTH the Argus
# core and the argus-probe proxies (see deploy/updater/). It rebuilds when its sources change,
# publishing :latest (+ :sha). A vX.Y.Z tag additionally publishes a version-pinned image (:X.Y.Z,
# :X.Y) and a GitHub Release whose notes are the matching CHANGELOG.md section, so a deployment can
# pin an updater version instead of tracking :latest. A pull request (Dependabot's, or anyone's)
# runs the tests and builds the image without pushing it, then runs the tools it carries: a base or
# package bump that would break the build is seen on the pull request, not on the push to main that
# publishes :latest. Pull requests run with a read-only token and no secrets, so they cannot push,
# sign or release; publishing stays on main and the tags.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/updater/**'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'deploy/updater/**'
      - '.github/workflows/updater-image.yml'
  workflow_dispatch:

# Permissions are granted per job: the tests need nothing, the image build pushes to GHCR and
# publishes the Release on a tag.
permissions: {}

# Publishing runs queue behind each other and are never cancelled; a pull request's check is its
# own group, and a newer push to the same pull request cancels the older check.
concurrency:
  group: updater-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Guards the config-clone recreate logic (static IP / MAC / aliases / hostname must survive an
  # image swap). Pure shell + jq against fixture docker-inspect JSON - no daemon needed. The image
  # build depends on it, so a regression here never reaches :latest.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: recreate config-clone test
        run: bash deploy/updater/test/recreate_test.sh
      - name: container healthcheck test
        run: bash deploy/updater/test/healthcheck_test.sh
      - name: core collectors install test
        run: bash deploy/updater/test/collectors_test.sh
      - name: core host tools install test
        run: bash deploy/updater/test/hosttools_test.sh
      - name: job status file test
        run: bash deploy/updater/test/job_test.sh
      - name: image signature verification test
        run: bash deploy/updater/test/verify_test.sh

  # The pull request's check: the image is built exactly as the publish job builds it, but loaded
  # into the runner's Docker instead of pushed, and the tools it carries are run once. A Dependabot
  # bump of the Alpine digest, or of the build actions themselves, fails here before it is merged.
  build-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/updater
          file: ./deploy/updater/Dockerfile
          push: false
          load: true
          tags: argus-updater:pr
          build-args: |
            UPDATER_VERSION=pr-${{ github.event.pull_request.number }}
            APK_REFRESH=${{ github.run_id }}
          cache-from: type=gha
      - name: Run the tools the image carries
        run: |
          set -eu
          docker run --rm --entrypoint sh argus-updater:pr -c '
            set -eu
            echo "alpine $(cat /etc/alpine-release), updater $(cat /etc/argus-updater.version)"
            cosign version
            docker --version
            curl --version | head -n 1
            jq --version
            sh -n /usr/local/bin/argus-updater
            for f in /usr/local/lib/argus-updater/lib/*.sh /usr/local/lib/argus-updater/modes/*.sh /app/healthcheck.sh; do sh -n "$f"; done
          '

  docker:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write   # publish a Release on tag builds
      packages: write   # push the image to GHCR
      id-token: write   # keyless cosign: the signature names this workflow as the signer
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history + tags so git describe can stamp the build

      - name: Compute version
        id: version
        # This repo's own vX.Y.Z tags (the updater version line); '--always' falls back to a short
        # SHA between releases.
        run: echo "value=$(git describe --tags --match 'v*' --always --dirty)" >> "$GITHUB_OUTPUT"

      # Tag builds publish the CHANGELOG.md section for this version as the Release notes. Checked
      # before the build so a missing section fails fast and never pushes a version-pinned image.
      - name: Extract changelog section (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; print; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi
          {
            echo
            echo "Pull \`ghcr.io/${{ github.repository_owner }}/argus-updater:${VERSION}\`"
            echo "(version-pinned) or \`:latest\`. See the README for modes + wiring."
          } >> RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-updater
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/updater
          file: ./deploy/updater/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            UPDATER_VERSION=${{ steps.version.outputs.value }}
            APK_REFRESH=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature (Sigstore): the image digest is signed with a short-lived certificate bound
      # to THIS workflow's identity. The updater verifies its own next image with it before swapping
      # itself (lib/recreate.sh, verify_signature), as it verifies the core's and the probe's.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/argus-updater@${DIGEST}"

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: argus-updater ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
