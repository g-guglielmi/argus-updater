name: updater-image

# Builds & pushes the argus-updater sidecar image (ghcr.io/<owner>/argus-updater), the small
# socket-holding helper that recreates a target container on a new image - used by BOTH the Argus
# core and the argus-probe proxies (see deploy/updater/). It rebuilds when its sources change,
# publishing :latest (+ :sha). A vX.Y.Z tag additionally publishes a version-pinned image (:X.Y.Z,
# :X.Y) and a GitHub Release whose notes are the matching CHANGELOG.md section, so a deployment can
# pin an updater version instead of tracking :latest.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/updater/**'
    tags: ['v*']
  workflow_dispatch:

# Permissions are granted per job: the tests need nothing, the image build pushes to GHCR and
# publishes the Release on a tag.
permissions: {}

concurrency:
  group: updater-image
  cancel-in-progress: false

jobs:
  # Guards the config-clone recreate logic (static IP / MAC / aliases / hostname must survive an
  # image swap). Pure shell + jq against fixture docker-inspect JSON - no daemon needed. The image
  # build depends on it, so a regression here never reaches :latest.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: recreate config-clone test
        run: bash deploy/updater/test/recreate_test.sh

  docker:
    permissions:
      contents: write   # publish a Release on tag builds
      packages: write   # push the image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history + tags so git describe can stamp the build

      - name: Compute version
        id: version
        # This repo's own vX.Y.Z tags (the updater version line); '--always' falls back to a short
        # SHA between releases.
        run: echo "value=$(git describe --tags --match 'v*' --always --dirty)" >> "$GITHUB_OUTPUT"

      # Tag builds publish the CHANGELOG.md section for this version as the Release notes. Checked
      # before the build so a missing section fails fast and never pushes a version-pinned image.
      - name: Extract changelog section (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; print; next }
            flag && /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi
          {
            echo
            echo "Pull \`ghcr.io/${{ github.repository_owner }}/argus-updater:${VERSION}\`"
            echo "(version-pinned) or \`:latest\`. See the README for modes + wiring."
          } >> RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-updater
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./deploy/updater
          file: ./deploy/updater/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            UPDATER_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: argus-updater ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
